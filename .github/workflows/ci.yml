name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: [self-hosted, vps-ovh, zab-queryme]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --frozen
      - name: Run ruff
        run: uv run ruff check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: [self-hosted, vps-ovh, zab-queryme]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --frozen
      - name: Run mypy
        run: uv run mypy src

  test:
    name: Test (pytest)
    runs-on: [self-hosted, vps-ovh, zab-queryme]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --frozen
      - name: Run pytest
        # -v names every collected test in the log with its outcome
        # (PASSED/FAILED/SKIPPED). Plain `pytest --color=yes` only prints a
        # dot per file: a test that runs and a test that is present but
        # never collected are indiscernible in that output (ADR 013 §1.3.2,
        # RC5) — -v is the minimum needed to tell them apart.
        run: uv run pytest --color=yes -v

  deps-audit:
    name: Dependency audit (pip-audit)
    runs-on: [self-hosted, vps-ovh, zab-queryme]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --frozen
      - name: Run pip-audit
        run: uv run pip-audit --skip-editable

  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: [self-hosted, vps-ovh, zab-queryme]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the native trufflehog git scan covers the whole
          # repository, not just the tip commit.
          fetch-depth: 0
      - name: Install trufflehog
        # The trufflesecurity/trufflehog@main action runs via `docker run`,
        # which exits 125 on the JIT self-hosted runner (no Docker daemon).
        # Use the native binary instead — pinned, installed in-job, no docker.sock.
        # install.sh pinned to the commit tagged v3.90.10 (same version as the
        # binary below) instead of the mutable `main` branch.
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/bc2cd3e45e3aa4a6c627bd0c424580f86dde1855/scripts/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" v3.90.10
          "$RUNNER_TEMP/bin/trufflehog" --version
      - name: TruffleHog scan
        # Equivalent scan to the action (verified+unknown), over full git
        # history, failing on a detected secret. No Docker dependency.
        run: |
          "$RUNNER_TEMP/bin/trufflehog" git file://. --fail --no-update --results=verified,unknown

  lockfile-check:
    name: Lockfile check (uv lock --check)
    runs-on: [self-hosted, vps-ovh, zab-queryme]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.11"
      - name: Verify uv.lock is consistent with pyproject.toml
        run: uv lock --check

  codeowners-check:
    name: CODEOWNERS present
    runs-on: [self-hosted, vps-ovh, zab-queryme]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check CODEOWNERS exists
        run: |
          if [ ! -f .github/CODEOWNERS ] && [ ! -f CODEOWNERS ] && [ ! -f docs/CODEOWNERS ]; then
            echo "::error::CODEOWNERS file missing"
            exit 1
          fi
          echo "CODEOWNERS found"
